  <p>Tryck på knappen för att logga in.</p>
  <p style="margin:24px 0"><a href="{{ .ConfirmationURL }}" style="background:#14532d;color:#fff;padding:12px 20px;border-radius:6px;text-decoration:none;display:inline-block">Logga in</a></p>

</div>
