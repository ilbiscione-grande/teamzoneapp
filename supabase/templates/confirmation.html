<div style="font-family:Arial,sans-serif;font-size:16px;line-height:1.5;color:#1a1a1a;max-width:480px">
  <h2 style="font-size:20px;margin:0 0 16px">Bekräfta din e-postadress</h2>
  <p>Tryck på knappen för att bekräfta adressen {{ .Email }} och aktivera ditt konto.</p>
  <p style="margin:24px 0"><a href="{{ .ConfirmationURL }}" style="background:#14532d;color:#fff;padding:12px 20px;border-radius:6px;text-decoration:none;display:inline-block">Bekräfta adressen</a></p>
  <p>Eller skriv in koden <strong>{{ .Token }}</strong>.</p>
  <p style="color:#555;font-size:14px">Har du inte skapat något konto kan du bortse från mejlet.</p>
  <p style="color:#555;font-size:14px">Frågor? Mejla support@teamzoneapp.se.</p>
</div>
