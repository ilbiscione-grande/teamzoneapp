name: teamzone_notifications
description: TeamZone's Android notifications with actions (answering a callup from its notification).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: se.teamzone.notifications
        pluginClass: TeamzoneNotificationsPlugin
