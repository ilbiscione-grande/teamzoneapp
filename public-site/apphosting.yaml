runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 40

env:
  - variable: PUBLIC_ORIGIN
    value: https://teamzoneapp.se
    availability:
      - RUNTIME
  - variable: PUBLIC_SITE_ORIGINS
    value: https://public.teamzoneapp.se
    availability:
      - RUNTIME
  # App Hosting sends client, Google front end, Google proxy (measured
  # 2026-10-16): the client is two hops from the end.
  - variable: TRUSTED_PROXY_HOPS
    value: "2"
    availability:
      - RUNTIME
  - variable: CAPTCHA_VERIFY_URL
    value: https://challenges.cloudflare.com/turnstile/v0/siteverify
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_TURNSTILE_SITE_KEY
    value: 0x4AAAAAAEQ6g5LvDvlA-hM6
    availability:
      - BUILD
      - RUNTIME
  # The live database since 2026-11-22, like the app (app.teamzoneapp.se) and
  # Webtools; the test database has no public site of its own yet.
  - variable: SUPABASE_URL
    value: https://zfxcblgnemuenaqjkaic.supabase.co
    availability:
      - BUILD
      - RUNTIME
  - variable: SUPABASE_PUBLISHABLE_KEY
    value: sb_publishable_ee93wzcJc65uepVKi6WLww_zf-YdwmK
    availability:
      - RUNTIME
  # TeamZone Webtools in production; the header and footer link to it.
  - variable: NEXT_PUBLIC_WEBTOOLS_URL
    value: https://webtools.teamzoneapp.se
    availability:
      - BUILD
      - RUNTIME
  # The fixed start page that sells Tacticsboard. Remove when the app launches.
  - variable: NEXT_PUBLIC_TACTICSBOARD_LAUNCH
    value: "1"
    availability:
      - BUILD
      - RUNTIME
  # The links to the English pages, on since 2026-11-06.
  - variable: NEXT_PUBLIC_TACTICSBOARD_ENGLISH
    value: "on"
    availability:
      - BUILD
      - RUNTIME
  - variable: PUBLIC_PERSONAL_HOME_ENABLED
    value: "1"
    availability:
      - RUNTIME
  # Shared with Webtools in production: the same live project.
  - variable: SUPABASE_SECRET_KEY
    secret: teamzoneapp-production-webtools-supabase-secret-key
    availability:
      - RUNTIME
  - variable: PUBLIC_API_IP_HMAC_SECRET
    secret: teamzoneapp-public-api-ip-hmac-secret
    availability:
      - RUNTIME
  - variable: CAPTCHA_SECRET_KEY
    secret: teamzoneapp-turnstile-secret-key
    availability:
      - RUNTIME
  # The publication worker's token, the same as the live Vault's
  # public_site_worker_token (set 2026-11-22); the database calls the worker
  # with it every minute.
  - variable: CACHE_INVALIDATION_SECRET
    secret: teamzoneapp-production-cache-invalidation-secret
    availability:
      - RUNTIME
